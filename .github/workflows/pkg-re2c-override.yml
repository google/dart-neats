# Based on tool/update-github-config.sh, with re2c installed from conda-forge
# and a matrix over operating systems.
name: re2c
on:
  push:
    branches:
      - main
      - master
    paths:
      - '.github/workflows/pkg-re2c-override.yml'
      - 're2c/**'
  pull_request:
    paths:
      - '.github/workflows/pkg-re2c-override.yml'
      - 're2c/**'
  schedule:
    - cron: "0 0 * * 0"

defaults:
  run:
    working-directory: re2c/

env:
  PUB_ENVIRONMENT: bot.github

permissions: read-all

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        sdk:
          - stable
          - dev
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
    - uses: dart-lang/setup-dart@e51d8e571e22473a2ddebf0ef8a2123f0ab2c02c
      with:
        sdk: ${{ matrix.sdk }}
    - uses: mamba-org/setup-micromamba@b09ef9b599704322748535812ca03efb2625677b
      with:
        environment-name: re2c
        create-args: re2c=4.4
        init-shell: bash
    - id: install
      name: Install dependencies
      run: dart pub get
    - name: Check formatting
      run: dart format --output=none --set-exit-if-changed .
      if: always() && steps.install.outcome == 'success'
    - name: Analyze code
      run: dart analyze --fatal-infos
      if: always() && steps.install.outcome == 'success'
    - name: Run tests
      shell: bash -el {0}
      run: re2c --version && dart test
