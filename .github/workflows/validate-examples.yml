# Reusable workflow for checking that `@example` markdown code blocks are up to
# date. Callers should pin to a commit SHA:
#
#   jobs:
#     examples:
#       uses: google/dart-neats/.github/workflows/validate-examples.yml@<commit-sha>
name: Validate examples

on:
  workflow_call:
    inputs:
      directory:
        description: 'Directory to validate (defaults to repository root).'
        required: false
        default: '.'
        type: string
      sdk:
        description: 'Dart SDK version or channel (must be >= 3.12.0).'
        required: false
        default: 'stable'
        type: string

permissions:
  contents: read

env:
  PUB_ENVIRONMENT: bot.github

jobs:
  validate:
    name: Validate markdown examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@e51d8e571e22473a2ddebf0ef8a2123f0ab2c02c
        with:
          sdk: ${{ inputs.sdk }}
      - name: Validate examples
        shell: bash
        env:
          DIRECTORY: ${{ inputs.directory }}
        run: dart run snippets@ validate -C "$DIRECTORY"
